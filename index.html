<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Terrarium">
<meta name="description" content="外部通信や生成AIを一切使わず、ブラウザの中だけで5人の関係性がゆっくり沈殿していく、小さな言葉のアクアリウム。">
<meta property="og:title" content="Latent Terrarium">
<meta property="og:description" content="外部通信・生成AIなし。ブラウザの中だけで5人の関係性がゆっくり沈殿していく、小さな「言葉のアクアリウム」。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://33kasp33-cpu.github.io/latent-terrarium/">
<meta property="og:image" content="https://33kasp33-cpu.github.io/latent-terrarium/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Latent Terrarium">
<meta name="twitter:description" content="5人の関係性がゆっくり沈殿していく、小さな「言葉のアクアリウム」（外部通信・AIなし／ブラウザ完結）。">
<meta name="twitter:image" content="https://33kasp33-cpu.github.io/latent-terrarium/ogp.png">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="alternate" hreflang="ja" href="https://33kasp33-cpu.github.io/latent-terrarium/">
<link rel="alternate" hreflang="en" href="https://33kasp33-cpu.github.io/latent-terrarium/en/">
<link rel="stylesheet" href="./terrarium.css">
<title>Latent Terrarium v1.0</title>
</head>
<body>
<main>
  <header>
    <div class="title-wrap">
      <h1>Latent Terrarium<small>v1.0</small></h1>
      <span class="lit-badge" id="litBadge" title="現在の水中の光">宵闇</span>
    </div>
    <div class="links">
      <span id="bSnd" role="button" tabindex="0" title="水音と共鳴音の切り替え">音: 消</span>
      <span id="bLit" role="button" tabindex="0" title="照明モードの切り替え">光: 自然</span>
      <span id="bX" role="button" tabindex="0">川底を見る</span>
      <a href="./en/" title="English version">EN</a>
    </div>
  </header>
  <div class="inapp-note hidden" id="inappNote">
    <span>アプリ内ブラウザでは記録が消えやすいため、長く育てる場合は「Safari / Chromeで開く」がおすすめです（川底から記録の書き出し・引き継ぎもできます）</span>
    <button type="button" id="bInappClose" aria-label="閉じる">×</button>
  </div>
  <div class="terrarium">
    <canvas id="cv" title="水面に触れると、小さな粒が落ちてしばらく漂います（長押しで温かな粒）"></canvas>
    <div class="drop-bar" id="dropBar">
      <div class="drop-pills" role="group" aria-label="雫の種類">
        <button type="button" class="pill active" data-drop="topic" id="dTopic" title="話題の粒を落とす"><i>●</i>光 <span>話題</span></button>
        <button type="button" class="pill" data-drop="warm" id="dWarm" title="和らぎの粒を落とす（長押しでも可）"><i>●</i>温 <span>和らぎ</span></button>
        <button type="button" class="pill" data-drop="clear" id="dClear" title="癒やしの粒を落とす"><i>●</i>澄 <span>癒やし</span></button>
      </div>
      <div class="tank-status" id="tankStatus">1日目 · 静か</div>
    </div>
    <div class="feed" id="feed"></div>
  </div>
  <div class="xray hidden" id="xray">
    <div id="rows"></div>
    <div class="grid" id="grid"></div>
    <div id="mems"></div>
    <div id="echoes"></div>
    <div id="meta"></div>
    <div class="tools">
      <button id="bExp" class="hidden">記録を書き出す</button>
      <button id="bImp">記録を読み込む</button>
      <button id="bRst" class="warn">水を入れ替える</button>
      <button id="bD1" class="hidden">+3時間</button>
      <button id="bD2" class="hidden">+1日</button>
      <input type="file" id="fImp" accept="application/json,.json,.txt" class="hidden">
    </div>
  </div>
</main>
<script src="./lang-ja.js"></script>
<script src="./terrarium.js"></script>
</body>
</html>
